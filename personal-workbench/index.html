<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的工作台 · 桌面版</title>
<link rel="stylesheet" href="styles/style.css?v=7">
<script>
// 在页面渲染前应用保存的主题，避免 FOUC
(function(){
  try {
    var raw = localStorage.getItem("workbench-desktop-v1");
    if(raw){
      var d = JSON.parse(raw);
      if(d.__theme) document.documentElement.setAttribute("data-mode", d.__theme);
    }
  } catch(e){}
})();
</script>
</head>
<body>
<div class="layout">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="ava" id="ava" title="点击更换头像（自动压缩 ≤256×256 JPEG 85%）"><img src="assets/avatar.jpg" alt="头像" id="avaImg"/><span class="cam" id="avaCam"></span></div>
      <input type="file" id="avatarInput" accept="image/*" hidden/>
      <div><h1 id="brandName">我的工作台</h1><p id="brandSlogan">Personal Workbench</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot">数据仅存在本机 · 可在设置中开启同步</div>
  </aside>
  <!-- main -->
  <main class="main"><div id="screen"></div></main>
</div>

<script src="scripts/app.js?v=6"></script>
</body>
</html>
